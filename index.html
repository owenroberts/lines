<!doctype html>
<html>
<head>
	<title>lines</title>
	<meta charset="utf-8" />
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<style>
		#wrap {
			font-size: 18px;
			width: 600px;
			margin: 2em auto;
		}
	</style>
</head>
<body>
	<div id="wrap">
		<p>lines animation by owen ribbit</p>
		<canvas id="lines"></canvas>
		<ul>
			<li><a href="animate/">animate</a></li>
			<li><a href="game/">game engine</a></li>
			<li><a href="editor/">game editor</a></li>
		</ul>
	</div>
	
	<script type="module">
		import data from './examples/lines.json';
		import { Renderer, Anim, LinesFiles } from './src/lines.js';

		const renderer = new Renderer({
			width: data.w,
			height: data.h,
			bgColor: data.bg,
			isMultiColor: data.mc,
			dps: 30,
		});

		const animation = new Anim(renderer);
		const fm = new LinesFiles(animation, renderer);
		fm.loadData(data);

		console.log({ renderer, animation, fm })

		renderer.onDraw = _timeElapsed => {
			animation.update();
			animation.draw();
		};

		renderer.start();
		animation.play();
	</script>
</body>
</html>
